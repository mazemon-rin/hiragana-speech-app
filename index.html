<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ひらがな表" />
    <title>ひらがな おしゃべり表</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="practice-area" aria-labelledby="app-title">
        <div class="heading">
          <p class="eyebrow">ひらがな</p>
          <h1 id="app-title">おしゃべり五十音表</h1>
          <p class="lead">文字を選んで言葉を作ると、日本語の音声で順番に読み上げます。</p>
        </div>

        <nav class="mode-tabs" aria-label="メニュー">
          <button class="tab-button" type="button" data-tab="kana" aria-selected="true">五十音</button>
          <button class="tab-button" type="button" data-tab="favorites" aria-selected="false">お気に入り</button>
          <button class="tab-button" type="button" data-tab="history" aria-selected="false">履歴</button>
          <button class="tab-button" type="button" data-tab="templates" aria-selected="false">定型文</button>
          <button class="tab-button" type="button" data-tab="communication" aria-selected="false">コミュニケーション</button>
        </nav>

        <div class="status-panel" aria-live="polite">
          <span class="status-label">さいごの文字</span>
          <strong id="selected-kana">あ</strong>
          <span id="speech-status">準備できています</span>
        </div>

        <div class="word-panel" aria-live="polite">
          <span class="status-label">作った言葉</span>
          <output id="word-output" aria-label="作った言葉">まだありません</output>
        </div>

        <div class="play-controls" aria-label="読み上げ操作">
          <button id="start-button" class="action-button start" type="button">
            <span aria-hidden="true">▶</span>
            <span>開始</span>
          </button>
          <button id="stop-button" class="action-button stop" type="button">
            <span aria-hidden="true">■</span>
            <span>終了</span>
          </button>
          <button id="delete-button" class="action-button delete" type="button" aria-label="一文字消す">
            <span aria-hidden="true">⌫</span>
            <span>1文字消す</span>
          </button>
          <button id="clear-button" class="action-button clear" type="button">
            <span aria-hidden="true">×</span>
            <span>言葉を消す</span>
          </button>
          <button id="script-toggle-button" class="action-button script-toggle" type="button" aria-label="カタカナに切り替える">
            カタカナ
          </button>
          <button id="favorite-add-button" class="action-button favorite-add" type="button">
            ★お気に入り登録
          </button>
        </div>

        <div class="controls" aria-label="音声設定">
          <button id="repeat-button" class="icon-button" type="button" aria-label="もう一度読む">
            <span aria-hidden="true">↻</span>
          </button>
          <label class="voice-control">
            <span>声</span>
            <select id="voice-select" aria-label="声を選ぶ"></select>
          </label>
          <label class="range-control">
            <span>速さ</span>
            <input id="rate-control" type="range" min="0.7" max="1.2" step="0.1" value="0.9" />
          </label>
        </div>

        <div class="tab-panels">
          <section class="tab-panel is-active" data-panel="kana" aria-label="五十音">
            <div class="board-scroll-controls" aria-label="文字表のスクロール">
              <button id="scroll-right-button" class="scroll-button" type="button" aria-label="左へスクロール">
                <span aria-hidden="true">←</span>
              </button>
              <button id="scroll-left-button" class="scroll-button" type="button" aria-label="右へスクロール">
                <span aria-hidden="true">→</span>
              </button>
            </div>

            <div id="kana-board" class="kana-board" aria-label="ひらがなと濁音の表"></div>
          </section>

          <section class="tab-panel" data-panel="favorites" aria-label="お気に入り">
            <div class="panel-heading">
              <h2>お気に入り</h2>
            </div>
            <div id="favorites-list" class="phrase-list" aria-live="polite"></div>
          </section>

          <section class="tab-panel" data-panel="history" aria-label="履歴">
            <div class="panel-heading">
              <h2>履歴</h2>
            </div>
            <div id="history-list" class="phrase-list" aria-live="polite"></div>
          </section>

          <section class="tab-panel" data-panel="templates" aria-label="定型文">
            <div class="panel-heading">
              <h2>定型文</h2>
            </div>
            <div id="template-list" class="template-sections"></div>
          </section>

          <section class="tab-panel" data-panel="communication" aria-label="コミュニケーション">
            <div class="panel-heading">
              <h2>コミュニケーション</h2>
            </div>
            <div id="communication-grid" class="communication-grid"></div>
          </section>
        </div>

        <p class="copyright-notice">
          © 2026 mazemon-rin. 無断転載・複製・改変・再配布を禁じます。
        </p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
